<style>
/* ── Variables ─────────────────────────────────────── */
:root {
  --bg:        #0d0f14;
  --bg2:       #13161e;
  --bg3:       #1a1e2a;
  --border:    #252a38;
  --border2:   #2e3448;
  --text:      #e8eaf0;
  --text2:     #8b91a8;
  --text3:     #555d78;
  --accent:    #4fffb0;
  --accent2:   #00d4ff;
  --warn:      #ffb347;
  --danger:    #ff5e6c;
  --ok:        #4fffb0;
  --mono:      'Space Mono', monospace;
  --sans:      'DM Sans', sans-serif;
  --radius:    10px;
  --radius-lg: 16px;
}

/* ── Reset ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── Scrollbar ─────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── Header ────────────────────────────────────────── */
.header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 14px; }
.logo-mark {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo-mark svg { width: 18px; height: 18px; }
.header-title {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--text);
}
.header-sub {
  font-size: 11px;
  color: var(--text3);
  letter-spacing: .04em;
}
.header-right { display: flex; align-items: center; gap: 20px; }
.refresh-info {
  font-size: 11px;
  color: var(--text3);
  font-family: var(--mono);
}
.refresh-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  display: inline-block;
  margin-right: 6px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: .3; }
}
.last-update {
  font-size: 11px;
  color: var(--text3);
  font-family: var(--mono);
}

/* ── Nav tabs ──────────────────────────────────────── */
.nav {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  display: flex;
  gap: 4px;
}
.nav-tab {
  padding: 10px 16px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
  user-select: none;
  letter-spacing: .02em;
}
.nav-tab:hover { color: var(--text2); }
.nav-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ── Main layout ───────────────────────────────────── */
.main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }
.section { display: none; }
.section.active { display: block; }

/* ── Section title ─────────────────────────────────── */
.section-title {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--text3);
  text-transform: uppercase;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── Cards ─────────────────────────────────────────── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
}
.card-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 14px;
}

/* ── Grid helpers ──────────────────────────────────── */
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; }
.mb-20 { margin-bottom: 20px; }
.mb-28 { margin-bottom: 28px; }

/* ── Status cards ──────────────────────────────────── */
.status-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
  overflow: hidden;
}
.status-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
  opacity: 0;
  transition: opacity .3s;
}
.status-card.ok::before    { background: var(--ok);     opacity: 1; }
.status-card.warn::before  { background: var(--warn);   opacity: 1; }
.status-card.danger::before{ background: var(--danger); opacity: 1; }

.status-header { display: flex; align-items: center; justify-content: space-between; }
.status-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text3);
}
.status-badge {
  font-family: var(--mono);
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 4px;
  font-weight: 700;
  letter-spacing: .04em;
}
.badge-ok     { background: rgba(79,255,176,.12); color: var(--ok); }
.badge-warn   { background: rgba(255,179,71,.12);  color: var(--warn); }
.badge-danger { background: rgba(255,94,108,.12);  color: var(--danger); }
.badge-gray   { background: rgba(139,145,168,.1);  color: var(--text2); }

.status-value {
  font-family: var(--mono);
  font-size: 28px;
  font-weight: 700;
  line-height: 1;
  color: var(--text);
}
.status-value span { font-size: 13px; color: var(--text3); margin-left: 4px; font-weight: 400; }
.status-meta { font-size: 11px; color: var(--text3); }

/* ── Semáforo nodo ─────────────────────────────────── */
.node-status-row {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}
.node-card {
  flex: 1;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.node-indicator {
  width: 12px; height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: background .4s;
}
.node-indicator.ok     { background: var(--ok);     box-shadow: 0 0 8px var(--ok); }
.node-indicator.warn   { background: var(--warn);   box-shadow: 0 0 8px var(--warn); }
.node-indicator.danger { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.node-indicator.gray   { background: var(--text3); }

.node-name {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
}
.node-detail { font-size: 11px; color: var(--text3); margin-top: 2px; }
.node-status-text {
  margin-left: auto;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .04em;
}
.node-status-text.ok     { color: var(--ok); }
.node-status-text.warn   { color: var(--warn); }
.node-status-text.danger { color: var(--danger); }
.node-status-text.gray   { color: var(--text3); }

/* ── Metric row ─────────────────────────────────────── */
.metric-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.metric-row:last-child { border-bottom: none; }
.metric-key { font-size: 12px; color: var(--text2); }
.metric-val {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text);
  font-weight: 700;
}
.metric-val.ok     { color: var(--ok); }
.metric-val.warn   { color: var(--warn); }
.metric-val.danger { color: var(--danger); }

/* ── Charts ─────────────────────────────────────────── */
.chart-wrap {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  margin-bottom: 14px;
}
.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.chart-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: .02em;
}
.chart-unit {
  font-size: 11px;
  color: var(--text3);
  font-family: var(--mono);
}
.chart-legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--text2);
}
.legend-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
canvas { max-height: 220px; }

/* ── Sensor grid ─────────────────────────────────────── */
.sensor-group-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text3);
  padding: 12px 0 8px;
  border-top: 1px solid var(--border);
  margin-top: 8px;
}
.sensor-group-title:first-child { border-top: none; margin-top: 0; padding-top: 0; }

/* ── Log de eventos ─────────────────────────────────── */
.events-filter {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.filter-btn {
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border2);
  background: var(--bg3);
  color: var(--text2);
  transition: all .15s;
  letter-spacing: .03em;
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { background: rgba(79,255,176,.1); border-color: var(--accent); color: var(--accent); }

.events-table { width: 100%; border-collapse: collapse; }
.events-table th {
  text-align: left;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text3);
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}
.events-table td {
  padding: 9px 12px;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.events-table tr:last-child td { border-bottom: none; }
.events-table tr:hover td { background: var(--bg3); }

.event-tipo {
  font-family: var(--mono);
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 4px;
  font-weight: 700;
  white-space: nowrap;
}
.tipo-BOOT           { background: rgba(0,212,255,.1);  color: var(--accent2); }
.tipo-SYNC_COMPLETE  { background: rgba(79,255,176,.1); color: var(--ok); }
.tipo-SYNC_PARTIAL   { background: rgba(255,179,71,.1); color: var(--warn); }
.tipo-SYNC_START     { background: rgba(139,145,168,.1);color: var(--text2); }
.tipo-NODE_FAIL      { background: rgba(255,94,108,.1); color: var(--danger); }
.tipo-AUTO_RESYNC_TRIGGER { background: rgba(255,179,71,.1); color: var(--warn); }
.tipo-LORA_FAIL_LIMIT{ background: rgba(255,94,108,.1); color: var(--danger); }
.tipo-WATCHDOG_TRIGGER{ background: rgba(255,94,108,.1);color: var(--danger); }
.tipo-CYCLE_START    { background: rgba(139,145,168,.08);color: var(--text3); }
.tipo-CYCLE_END      { background: rgba(139,145,168,.08);color: var(--text3); }
.tipo-CONFIG_WARN    { background: rgba(255,179,71,.1); color: var(--warn); }
/* v4: nuevos tipos de evento */
.tipo-DATA_RX_SCID_DRIFT   { background: rgba(255,179,71,.1);  color: var(--warn); }
.tipo-EMPTY_RX_SCID_DRIFT  { background: rgba(255,179,71,.1);  color: var(--warn); }
.tipo-default        { background: rgba(139,145,168,.08);color: var(--text3); }

/* v4: badge naranja para estado FAIL_DESYNC en tabla de ciclos */
.metric-val.desync { color: #ff9f43; }
.metric-val.drift  { color: var(--warn); }

.event-detalle { color: var(--text2); font-size: 11px; max-width: 400px; word-break: break-all; }
.event-time    { color: var(--text3); font-size: 11px; font-family: var(--mono); white-space: nowrap; }

/* ── Descarga CSV ────────────────────────────────────── */
.download-panel {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px 32px;
  max-width: 560px;
}
.download-panel h3 {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}
.download-panel p {
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 24px;
  line-height: 1.7;
}
.form-row { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 160px; }
.form-label { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: .05em; text-transform: uppercase; }
.form-input {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 9px 12px;
  color: var(--text);
  font-size: 13px;
  font-family: var(--mono);
  outline: none;
  transition: border-color .15s;
  width: 100%;
}
.form-input:focus { border-color: var(--accent); }
.form-input::-webkit-calendar-picker-indicator { filter: invert(.6); }

.btn {
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  letter-spacing: .02em;
}
.btn-primary {
  background: var(--accent);
  color: #0d0f14;
}
.btn-primary:hover { background: #3de89e; transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }

.download-stats {
  margin-top: 16px;
  padding: 12px 16px;
  background: var(--bg3);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text2);
  display: none;
}

/* ── Loading / Empty states ─────────────────────────── */
.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  color: var(--text3);
  gap: 12px;
}
.spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 12px; font-family: var(--mono); }

.empty-state {
  padding: 40px 20px;
  text-align: center;
  color: var(--text3);
  font-size: 12px;
}

/* ── Error banner ────────────────────────────────────── */
.error-banner {
  background: rgba(255,94,108,.08);
  border: 1px solid rgba(255,94,108,.25);
  border-radius: var(--radius);
  padding: 10px 16px;
  font-size: 12px;
  color: var(--danger);
  margin-bottom: 16px;
  display: none;
}

/* ── Responsive ─────────────────────────────────────── */
@media (max-width: 900px) {
  .main { padding: 16px; }
  .grid-4 { grid-template-columns: repeat(2,1fr); }
  .grid-3 { grid-template-columns: repeat(2,1fr); }
  .header { padding: 0 16px; }
  .nav { padding: 0 16px; overflow-x: auto; }
}
@media (max-width: 600px) {
  .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
  .node-status-row { flex-direction: column; }
  .header-sub { display: none; }
}
/* ════════════════════════════════════════════════════
   NUEVOS COMPONENTES (v5)
═══════════════════════════════════════════════════════ */

/* ── Indicador de conexión en vivo (header) ───────────── */
.conn {
  display: flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 11px;
  padding: 5px 11px; border-radius: 20px;
  border: 1px solid var(--border2);
  background: var(--bg3);
  white-space: nowrap;
}
.conn-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--text3); }
.conn.live    { border-color: rgba(79,255,176,.35); color: var(--ok); }
.conn.live    .conn-dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 1.6s infinite; }
.conn.polling { border-color: rgba(255,179,71,.35); color: var(--warn); }
.conn.polling .conn-dot { background: var(--warn); animation: pulse 2s infinite; }
.conn.down    { border-color: rgba(255,94,108,.35); color: var(--danger); }
.conn.down    .conn-dot { background: var(--danger); }

/* ── Toasts (avisos flotantes) ────────────────────────── */
.toast-wrap {
  position: fixed; top: 72px; right: 20px; z-index: 1000;
  display: flex; flex-direction: column; gap: 10px;
  max-width: calc(100vw - 40px);
}
.toast {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-left: 3px solid var(--danger);
  border-radius: 10px;
  padding: 12px 16px;
  width: 320px; max-width: 100%;
  box-shadow: 0 12px 32px rgba(0,0,0,.5);
  animation: toastIn .3s ease;
  cursor: pointer;
}
.toast.warn { border-left-color: var(--warn); }
.toast.ok   { border-left-color: var(--ok); }
.toast-title { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 3px; display: flex; justify-content: space-between; gap: 8px; }
.toast-time  { font-family: var(--mono); font-size: 10px; color: var(--text3); font-weight: 400; }
.toast-msg   { font-size: 12px; color: var(--text2); line-height: 1.5; }
@keyframes toastIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }

/* ── Gauges circulares (RSSI / SNR) ───────────────────── */
.gauge-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
.gauge-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 16px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.gauge-card .g-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); }
.gauge-canvas-wrap { position: relative; width: 130px; height: 130px; }
.gauge-canvas-wrap canvas { max-height: 130px; }
.gauge-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none;
}
.gauge-num  { font-family: var(--mono); font-size: 24px; font-weight: 700; line-height: 1; }
.gauge-unit { font-size: 10px; color: var(--text3); margin-top: 2px; }
.gauge-quality { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }

/* ── Índice de salud de red ───────────────────────────── */
.health-card {
  background: linear-gradient(135deg, var(--bg2), var(--bg3));
  border: 1px solid var(--border2);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  display: flex; align-items: center; gap: 22px;
}
.health-ring-wrap { position: relative; width: 110px; height: 110px; flex-shrink: 0; }
.health-ring-wrap canvas { max-height: 110px; }
.health-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.health-num { font-family: var(--mono); font-size: 30px; font-weight: 700; line-height: 1; }
.health-max { font-size: 11px; color: var(--text3); }
.health-info { flex: 1; }
.health-info h4 { font-size: 13px; color: var(--text); margin-bottom: 4px; }
.health-info .h-state { font-family: var(--mono); font-size: 12px; font-weight: 700; }
.health-info p { font-size: 12px; color: var(--text2); margin-top: 6px; line-height: 1.5; }

/* ── Mapa de nodos ────────────────────────────────────── */
#mapNodos {
  height: 460px; width: 100%;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  background: var(--bg2);
  z-index: 1;
}
.leaflet-container { background: #0a0c10 !important; font-family: var(--sans) !important; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip {
  background: var(--bg3) !important; color: var(--text) !important;
  border: 1px solid var(--border2);
}
.leaflet-popup-content { margin: 12px 14px !important; font-size: 12px !important; }
.leaflet-popup-content b { font-family: var(--mono); }
.leaflet-bar a { background: var(--bg3) !important; color: var(--text2) !important; border-color: var(--border) !important; }
.leaflet-control-attribution { background: rgba(13,15,20,.7) !important; color: var(--text3) !important; }
.leaflet-control-attribution a { color: var(--text2) !important; }
.map-pin {
  width: 18px; height: 18px; border-radius: 50%;
  border: 3px solid #0d0f14; box-shadow: 0 0 0 2px currentColor, 0 0 10px currentColor;
}
.map-legend {
  display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px;
  font-size: 11px; color: var(--text2);
}
.map-legend .leg { display: flex; align-items: center; gap: 6px; }
.map-legend .leg-dot { width: 9px; height: 9px; border-radius: 50%; }

/* ── Tablas con scroll en móvil ───────────────────────── */
.table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* ── Botón reintentar (estado de error) ───────────────── */
.btn-retry {
  margin-top: 10px;
  padding: 7px 16px; border-radius: 7px;
  background: var(--bg3); color: var(--text);
  border: 1px solid var(--border2); cursor: pointer;
  font-size: 12px; font-weight: 600;
}
.btn-retry:hover { border-color: var(--danger); color: var(--danger); }

/* ── Responsive extra (v5) ────────────────────────────── */
@media (max-width: 900px) {
  .gauge-grid { grid-template-columns: repeat(2,1fr); }
}
@media (max-width: 600px) {
  .header { height: auto; padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
  .header-right { gap: 10px; width: 100%; justify-content: space-between; }
  .gauge-grid { grid-template-columns: repeat(2,1fr); }
  .health-card { flex-direction: column; text-align: center; }
  #mapNodos { height: 340px; }
  .toast-wrap { left: 14px; right: 14px; }
  .toast { width: 100%; }
  .nav-tab { padding: 10px 12px; }
}

</head>
<body>

<!-- Contenedor de avisos flotantes (toasts) -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- ── HEADER ──────────────────────────────────────── -->
<header class="header">
  <div class="header-left">
    <div class="logo-mark" style="background:transparent;width:34px;height:34px">
      <svg viewBox="0 0 64 64" width="34" height="34" aria-label="Logo Red LoRa">
        <g fill="none" stroke="#4fffb0" stroke-linecap="round">
          <path d="M32 32 m-9 0 a9 9 0 0 1 18 0" opacity="0.55" stroke-width="3"/>
          <path d="M32 32 m-15 0 a15 15 0 0 1 30 0" opacity="0.28" stroke-width="3"/>
        </g>
        <g stroke="#00d4ff" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
          <line x1="32" y1="32" x2="17" y2="47"/>
          <line x1="32" y1="32" x2="47" y2="47"/>
        </g>
        <circle cx="17" cy="47" r="4" fill="#00d4ff"/>
        <circle cx="47" cy="47" r="4" fill="#ffb347"/>
        <circle cx="32" cy="32" r="6.5" fill="#0d0f14" stroke="#4fffb0" stroke-width="2.6"/>
        <circle cx="32" cy="32" r="2.6" fill="#4fffb0"/>
      </svg>
    </div>
    <div>
      <div class="header-title">RED LORA MULTINODO</div>
      <div class="header-sub">Sistema de monitoreo ambiental · Tesis · v5</div>
    </div>
  </div>
  <div class="header-right">
    <div class="conn" id="connStatus"><span class="conn-dot"></span><span id="connText">Conectando…</span></div>
    <div class="last-update">Últ. dato <span id="lastSeen">—</span></div>
  </div>
</header>

<!-- ── NAV TABS ────────────────────────────────────── -->
<nav class="nav">
  <div class="nav-tab active" data-tab="estado"      onclick="showTab('estado', this)">Estado del sistema</div>
  <div class="nav-tab"        data-tab="diagnostico" onclick="showTab('diagnostico', this)">Diagnóstico LoRa</div>
  <div class="nav-tab"        data-tab="sensores"    onclick="showTab('sensores', this)">Sensores ambientales</div>
  <div class="nav-tab"        data-tab="mapa"        onclick="showTab('mapa', this)">Mapa de nodos</div>
  <div class="nav-tab"        data-tab="eventos"     onclick="showTab('eventos', this)">Log de eventos</div>
  <div class="nav-tab"        data-tab="descarga"    onclick="showTab('descarga', this)">Descarga de datos</div>
</nav>

<!-- ── MAIN ────────────────────────────────────────── -->
<main class="main">
<div id="errorBanner" class="error-banner"></div>

<!-- ═══════════════════════════════════════════════════
     TAB 1 — ESTADO DEL SISTEMA
═══════════════════════════════════════════════════ -->
<section id="tab-estado" class="section active">

  <div class="section-title">Nodos de la red</div>
  <div class="node-status-row mb-20">
    <div class="node-card" id="nodeRX">
      <div class="node-indicator gray" id="indRX"></div>
      <div>
        <div class="node-name">RX — Coordinador</div>
        <div class="node-detail" id="detRX">Cargando…</div>
      </div>
      <div class="node-status-text gray" id="stRX">—</div>
    </div>
    <div class="node-card" id="nodeTX1">
      <div class="node-indicator gray" id="indTX1"></div>
      <div>
        <div class="node-name">TX1 — Estación 1</div>
        <div class="node-detail" id="detTX1">Cargando…</div>
      </div>
      <div class="node-status-text gray" id="stTX1">—</div>
    </div>
    <div class="node-card" id="nodeTX2">
      <div class="node-indicator gray" id="indTX2"></div>
      <div>
        <div class="node-name">TX2 — Estación 2</div>
        <div class="node-detail" id="detTX2">Cargando…</div>
      </div>
      <div class="node-status-text gray" id="stTX2">—</div>
    </div>
  </div>

  <div class="section-title">Métricas de sesión</div>
  <div class="grid-4 mb-28">
    <div class="status-card" id="cardSID">
      <div class="status-header">
        <span class="status-label">Sesión activa</span>
        <span class="status-badge badge-gray" id="badgeSID">SID</span>
      </div>
      <div class="status-value" id="valSID">—</div>
      <div class="status-meta" id="metaSID">Identificador de sesión</div>
    </div>
    <div class="status-card" id="cardSCID">
      <div class="status-header">
        <span class="status-label">Ciclo actual</span>
        <span class="status-badge badge-gray">SCID</span>
      </div>
      <div class="status-value" id="valSCID">—</div>
      <div class="status-meta" id="metaSCID">Ciclos desde último SYNC</div>
    </div>
    <div class="status-card" id="cardUltimo">
      <div class="status-header">
        <span class="status-label">Último ciclo</span>
        <span class="status-badge badge-gray" id="badgeUltimo">—</span>
      </div>
      <div class="status-value" id="valUltimo" style="font-size:18px">—</div>
      <div class="status-meta" id="metaUltimo">Hora del último registro</div>
    </div>
    <div class="status-card" id="cardTotal">
      <div class="status-header">
        <span class="status-label">Ciclos totales</span>
        <span class="status-badge badge-gray">RX_NCID</span>
      </div>
      <div class="status-value" id="valTotal">—</div>
      <div class="status-meta">Desde inicio del sistema</div>
    </div>
  </div>

  <div class="section-title">Resumen de los últimos 10 ciclos</div>
  <div class="card">
    <div id="resumenCiclos">
      <div class="loading-state"><div class="spinner"></div><div class="loading-text">Cargando datos…</div></div>
    </div>
  </div>

</section>

<!-- ═══════════════════════════════════════════════════
     TAB 2 — DIAGNÓSTICO LORA
═══════════════════════════════════════════════════ -->
<section id="tab-diagnostico" class="section">

  <div class="section-title">Salud de la red</div>
  <div class="health-card mb-20">
    <div class="health-ring-wrap">
      <canvas id="healthRing"></canvas>
      <div class="health-center">
        <div class="health-num" id="healthNum">—</div>
        <div class="health-max">/ 100</div>
      </div>
    </div>
    <div class="health-info">
      <h4>Índice de salud de la red <span class="h-state" id="healthState"></span></h4>
      <p id="healthDesc">Calculado a partir del uptime, la pérdida de paquetes y los intentos de POLL de ambos nodos en la ventana cargada.</p>
    </div>
  </div>

  <div class="section-title">Métricas de confiabilidad (ventana cargada)</div>
  <div class="grid-4 mb-20" id="reliabilityCards">
    <div class="status-card"><div class="status-header"><span class="status-label">Uptime TX1</span><span class="status-badge badge-gray" id="upBadgeTX1">—</span></div><div class="status-value" id="upTX1">—<span>%</span></div><div class="status-meta" id="upMetaTX1">Ciclos con datos OK</div></div>
    <div class="status-card"><div class="status-header"><span class="status-label">Uptime TX2</span><span class="status-badge badge-gray" id="upBadgeTX2">—</span></div><div class="status-value" id="upTX2">—<span>%</span></div><div class="status-meta" id="upMetaTX2">Ciclos con datos OK</div></div>
    <div class="status-card"><div class="status-header"><span class="status-label">Pérdida de paquetes</span><span class="status-badge badge-gray">GLOBAL</span></div><div class="status-value" id="lossGlobal">—<span>%</span></div><div class="status-meta">Ciclos sin dato útil</div></div>
    <div class="status-card"><div class="status-header"><span class="status-label">MTBF aprox.</span><span class="status-badge badge-gray">CICLOS</span></div><div class="status-value" id="mtbf">—</div><div class="status-meta">Ciclos entre fallos</div></div>
  </div>

  <div class="section-title">Calidad de enlace LoRa — RSSI &amp; SNR</div>
  <div class="gauge-grid mb-20">
    <div class="gauge-card">
      <div class="g-label">TX1 · RSSI</div>
      <div class="gauge-canvas-wrap"><canvas id="gaugeRSSI_TX1"></canvas>
        <div class="gauge-center"><div class="gauge-num" id="numRSSI_TX1">—</div><div class="gauge-unit">dBm</div><div class="gauge-quality" id="qRSSI_TX1"></div></div>
      </div>
    </div>
    <div class="gauge-card">
      <div class="g-label">TX1 · SNR</div>
      <div class="gauge-canvas-wrap"><canvas id="gaugeSNR_TX1"></canvas>
        <div class="gauge-center"><div class="gauge-num" id="numSNR_TX1">—</div><div class="gauge-unit">dB</div><div class="gauge-quality" id="qSNR_TX1"></div></div>
      </div>
    </div>
    <div class="gauge-card">
      <div class="g-label">TX2 · RSSI</div>
      <div class="gauge-canvas-wrap"><canvas id="gaugeRSSI_TX2"></canvas>
        <div class="gauge-center"><div class="gauge-num" id="numRSSI_TX2">—</div><div class="gauge-unit">dBm</div><div class="gauge-quality" id="qRSSI_TX2"></div></div>
      </div>
    </div>
    <div class="gauge-card">
      <div class="g-label">TX2 · SNR</div>
      <div class="gauge-canvas-wrap"><canvas id="gaugeSNR_TX2"></canvas>
        <div class="gauge-center"><div class="gauge-num" id="numSNR_TX2">—</div><div class="gauge-unit">dB</div><div class="gauge-quality" id="qSNR_TX2"></div></div>
      </div>
    </div>
  </div>

  <div class="section-title">Estado de comunicación por nodo</div>
  <div class="grid-2 mb-20">
    <div class="card">
      <div class="card-title">TX1 — Estación 1</div>
      <div id="diagTX1"><div class="loading-state"><div class="spinner"></div></div></div>
    </div>
    <div class="card">
      <div class="card-title">TX2 — Estación 2</div>
      <div id="diagTX2"><div class="loading-state"><div class="spinner"></div></div></div>
    </div>
  </div>

  <div class="section-title">Intentos de POLL por ciclo (últimos 30)</div>
  <div class="chart-wrap mb-20">
    <div class="chart-header">
      <div class="chart-title">Intentos necesarios para obtener respuesta</div>
      <div class="chart-unit">intentos</div>
    </div>
    <div class="chart-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#4fffb0"></div>TX1</div>
      <div class="legend-item"><div class="legend-dot" style="background:#00d4ff"></div>TX2</div>
    </div>
    <canvas id="chartIntentos"></canvas>
  </div>

  <div class="section-title">Historial de eventos críticos</div>
  <div class="grid-3">
    <div class="card">
      <div class="card-title">Reinicios del sistema</div>
      <div class="status-value" id="cntBoot" style="font-size:36px;color:var(--warn)">—</div>
      <div class="status-meta" style="margin-top:8px">BOOTs registrados</div>
    </div>
    <div class="card">
      <div class="card-title">Resyncs automáticos</div>
      <div class="status-value" id="cntResync" style="font-size:36px;color:var(--warn)">—</div>
      <div class="status-meta" style="margin-top:8px">AUTO_RESYNC_TRIGGER</div>
    </div>
    <div class="card">
      <div class="card-title">Fallos de nodo</div>
      <div class="status-value" id="cntNodeFail" style="font-size:36px;color:var(--danger)">—</div>
      <div class="status-meta" style="margin-top:8px">NODE_FAIL totales</div>
    </div>
  </div>

</section>

<!-- ═══════════════════════════════════════════════════
     TAB 3 — SENSORES AMBIENTALES
═══════════════════════════════════════════════════ -->
<section id="tab-sensores" class="section">

  <!-- Selector de estación -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
    <div class="section-title" style="margin-bottom:0">Estación seleccionada</div>
    <div style="display:flex;gap:8px">
      <button class="filter-btn active" id="btnEst-rx"  onclick="selectEstacion('rx')">RX — Coordinador</button>
      <button class="filter-btn"        id="btnEst-tx1" onclick="selectEstacion('tx1')">TX1 — Estación 1</button>
      <button class="filter-btn"        id="btnEst-tx2" onclick="selectEstacion('tx2')">TX2 — Estación 2</button>
    </div>
  </div>

  <!-- Bloque RX -->
  <div id="bloque-rx">
    <div class="section-title" style="color:var(--accent)">RX — Coordinador &nbsp;·&nbsp; últimas 24 h</div>

    <div class="section-title" style="margin-top:4px">Gases</div>
    <div class="grid-2 mb-20">
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">CO — Monóxido de carbono</div><div class="chart-unit">ppm</div></div>
        <canvas id="chartRX_co"></canvas>
      </div>
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">NO₂ — Dióxido de nitrógeno</div><div class="chart-unit">ppm</div></div>
        <canvas id="chartRX_no2"></canvas>
      </div>
    </div>
    <div class="grid-2 mb-20">
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">O₃ — Ozono</div><div class="chart-unit">ppm</div></div>
        <canvas id="chartRX_o3"></canvas>
      </div>
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">SO₂ — Dióxido de azufre</div><div class="chart-unit">ppm</div></div>
        <canvas id="chartRX_so2"></canvas>
      </div>
    </div>

    <div class="section-title">Material particulado</div>
    <div class="grid-2 mb-20">
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">PM2.5</div><div class="chart-unit">µg/m³</div></div>
        <canvas id="chartRX_pm25"></canvas>
      </div>
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">PM10</div><div class="chart-unit">µg/m³</div></div>
        <canvas id="chartRX_pm10"></canvas>
      </div>
    </div>

    <div class="section-title">Temperatura y Humedad</div>
    <div class="grid-2 mb-20">
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">Temperatura interior</div><div class="chart-unit">°C</div></div>
        <canvas id="chartRX_temp_in"></canvas>
      </div>
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">Humedad interior</div><div class="chart-unit">%</div></div>
        <canvas id="chartRX_hum_in"></canvas>
      </div>
    </div>
    <div class="grid-2">
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">Temperatura exterior</div><div class="chart-unit">°C</div></div>
        <canvas id="chartRX_temp_ex"></canvas>
      </div>
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">Humedad exterior</div><div class="chart-unit">%</div></div>
        <canvas id="chartRX_hum_ex"></canvas>
      </div>
    </div>

    <div class="section-title">Flujo de viento</div>
    <div class="grid-2">
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">Flujo viento 1</div><div class="chart-unit">SLM</div></div>
        <canvas id="chartRX_flujo1"></canvas>
      </div>
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">Flujo viento 2</div><div class="chart-unit">SLM</div></div>
        <canvas id="chartRX_flujo2"></canvas>
      </div>
    </div>
  </div>

  <!-- Bloque TX1 -->
  <div id="bloque-tx1" style="display:none">
    <div class="section-title" style="color:var(--accent2)">TX1 — Estación 1 &nbsp;·&nbsp; últimas 24 h</div>

    <div class="section-title" style="margin-top:4px">Gases</div>
    <div class="grid-2 mb-20">
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">CO — Monóxido de carbono</div><div class="chart-unit">ppm</div></div>
        <canvas id="chartTX1_co"></canvas>
      </div>
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">NO₂ — Dióxido de nitrógeno</div><div class="chart-unit">ppm</div></div>
        <canvas id="chartTX1_no2"></canvas>
      </div>
    </div>
    <div class="grid-2 mb-20">
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">O₃ — Ozono</div><div class="chart-unit">ppm</div></div>
        <canvas id="chartTX1_o3"></canvas>
      </div>
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">SO₂ — Dióxido de azufre</div><div class="chart-unit">ppm</div></div>
        <canvas id="chartTX1_so2"></canvas>
      </div>
    </div>

    <div class="section-title">Material particulado</div>
    <div class="grid-2 mb-20">
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">PM2.5</div><div class="chart-unit">µg/m³</div></div>
        <canvas id="chartTX1_pm25"></canvas>
      </div>
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">PM10</div><div class="chart-unit">µg/m³</div></div>
        <canvas id="chartTX1_pm10"></canvas>
      </div>
    </div>

    <div class="section-title">Temperatura y Humedad</div>
    <div class="grid-2 mb-20">
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">Temperatura interior</div><div class="chart-unit">°C</div></div>
        <canvas id="chartTX1_temp_in"></canvas>
      </div>
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">Humedad interior</div><div class="chart-unit">%</div></div>
        <canvas id="chartTX1_hum_in"></canvas>
      </div>
    </div>
    <div class="grid-2">
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">Temperatura exterior</div><div class="chart-unit">°C</div></div>
        <canvas id="chartTX1_temp_ex"></canvas>
      </div>
      <div class="chart-wrap" style="margin-bottom:0">
        <div class="chart-header"><div class="chart-title">Humedad exterior</div><div class="chart-unit">%</div></div>
        <canvas id="chartTX1_hum_ex"></canvas>
      </div>
    </div>

    <div class="section-title">Flujo de viento</div>

// ── Formato de fechas ─────────────────────────────────
function fmtDatetime(str) {
  if (!str) return '—';
  const d = new Date(str);
  return d.toLocaleString('es-PA', { month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false });
}
function fmtDate(str) {
  if (!str) return '—';
  const d = new Date(str);
  return d.toLocaleString('es-PA', { month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', hour12: false });
}
function timeAgo(str) {
  if (!str) return '—';
  const diff = Math.floor((Date.now() - new Date(str)) / 1000);
  if (diff < 60)  return `hace ${diff}s`;
  if (diff < 3600) return `hace ${Math.floor(diff/60)}min`;
  return `hace ${Math.floor(diff/3600)}h`;
}

// ── Valor numérico o nulo ─────────────────────────────
function v(val) { return (val !== null && val !== undefined) ? val : null; }
function fmt(val, dec=2) { return val !== null ? Number(val).toFixed(dec) : '—'; }

function upsertChart(id, labels, datasets) {
  const canvas = document.getElementById(id);

  charts[id] = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets },
    options: JSON.parse(JSON.stringify(CHART_DEFAULTS))
  });
}

// ═══════════════════════════════════════════════════════
// TAB 1 — ESTADO
// ═══════════════════════════════════════════════════════
function renderEstado() {
  if (!ciclos.length) return;
  const last = ciclos[ciclos.length - 1];

  // ── Nodos ──
  const minsSinceLastCycle = (Date.now() - new Date(last.created_at)) / 60000;
  const rxOk = minsSinceLastCycle < 12; // 2 ciclos de 5 min + margen

  setNode('RX', rxOk ? 'ok' : 'warn',
    rxOk ? 'EN LÍNEA' : 'SIN DATOS',
    'Último ciclo: ' + timeAgo(last.created_at));

  const tx1Status = last.tx1_status;
  const tx2Status = last.tx2_status;

  // v4: helper que mapea el nuevo conjunto de estados a color + etiqueta
  function txColor(st) {
    if (st === 'OK' || st === 'OK_LATE' || st === 'OK_SCID_DRIFT') return 'ok';
    if (st === 'EMPTY' || st === 'EMPTY_DRIFT') return 'warn';
    return 'danger';
  }
  function txLabel(st) {
    if (st === 'OK')           return 'DATOS OK';
    if (st === 'OK_LATE')      return 'TARDÍO';
    if (st === 'OK_SCID_DRIFT')return 'DATO (desfase SCID)';
    if (st === 'EMPTY')        return 'SIN MUESTRA';
    if (st === 'EMPTY_DRIFT')  return 'SIN MUESTRA (desfase)';
    if (st === 'FAIL_SILENT')  return 'MUDO — sin radio';
    if (st === 'FAIL_DESYNC')  return 'DESINCRONIZADO';
    return '—';
  }

  setNode('TX1', txColor(tx1Status), txLabel(tx1Status),
    `Intentos: ${last.tx1_attempts ?? '—'} · Streak: ${last.tx1_streak ?? '—'}`);
  setNode('TX2', txColor(tx2Status), txLabel(tx2Status),
    `Intentos: ${last.tx2_attempts ?? '—'} · Streak: ${last.tx2_streak ?? '—'}`);

  // ── Métricas ──
  document.getElementById('valSID').textContent   = last.session ?? '—';
  document.getElementById('valSCID').textContent  = last.scid ?? '—';
  document.getElementById('valTotal').textContent = last.rx_ncid ?? '—';

  const hora = last.created_at ? fmtDatetime(last.created_at) : '—';
  document.getElementById('valUltimo').textContent  = hora;
  document.getElementById('badgeUltimo').textContent = timeAgo(last.created_at);

  // ── Color de tarjetas según estado ──
  colorCard('cardSID',    true);
  colorCard('cardSCID',   true);
  colorCard('cardUltimo', rxOk, !rxOk);
  colorCard('cardTotal',  true);

  // ── Resumen últimos 10 ciclos ──
  const ultimos = ciclos.slice(-10);
  let html = '<table class="events-table"><thead><tr>' +
    '<th>Hora</th><th>SID</th><th>SCID</th><th>TX1</th><th>TX2</th><th>Fallos LoRa</th><th>Resync</th>' +
    '</tr></thead><tbody>';

  ultimos.reverse().forEach(c => {
    const stColor = st => {
      if (!st) return '';
      if (['OK','OK_LATE'].includes(st))       return 'ok';
      if (['OK_SCID_DRIFT'].includes(st))       return 'drift';
      if (['EMPTY','EMPTY_DRIFT'].includes(st)) return 'warn';
      if (st === 'FAIL_DESYNC')                 return 'desync';
      return 'danger';
    };
    const tx1cl = stColor(c.tx1_status);
    const tx2cl = stColor(c.tx2_status);
    html += `<tr>
      <td class="event-time">${fmtDatetime(c.created_at)}</td>
      <td class="metric-val">${c.session}</td>
      <td class="metric-val">${c.scid}</td>
      <td class="metric-val ${tx1cl}">${c.tx1_status ?? '—'}</td>
      <td class="metric-val ${tx2cl}">${c.tx2_status ?? '—'}</td>
      <td class="metric-val ${c.lora_fail_count > 0 ? 'warn' : ''}">${c.lora_fail_count ?? 0}</td>
      <td class="metric-val ${c.sync_triggered ? 'warn' : ''}">${c.sync_triggered ? '⚠ SÍ' : 'No'}</td>
    </tr>`;
  });

  html += '</tbody></table>';
  document.getElementById('resumenCiclos').innerHTML = '<div class="table-scroll">' + html + '</div>';
}

function setNode(name, status, label, detail) {
  const ind  = document.getElementById('ind'  + name);
  const st   = document.getElementById('st'   + name);
  const det  = document.getElementById('det'  + name);
  const card = document.getElementById('node' + name);

  ind.className  = 'node-indicator ' + status;
  st.className   = 'node-status-text ' + status;
  st.textContent = label;
  det.textContent = detail;
}

function colorCard(id, ok, warn=false) {
  const el = document.getElementById(id);
  el.classList.remove('ok','warn','danger');
  if (warn) el.classList.add('warn');
  else if (ok) el.classList.add('ok');
}

// ═══════════════════════════════════════════════════════
// TAB 2 — DIAGNÓSTICO
// ═══════════════════════════════════════════════════════
function renderDiagnostico() {
  if (!ciclos.length) return;
  const total = ciclos.length;

  function diagBlock(prefix) {
    const ok      = ciclos.filter(c => ['OK','OK_LATE','OK_SCID_DRIFT'].includes(c[prefix+'status'])).length;
    const drift   = ciclos.filter(c => c[prefix+'status'] === 'OK_SCID_DRIFT').length;
    const empty   = ciclos.filter(c => ['EMPTY','EMPTY_DRIFT'].includes(c[prefix+'status'])).length;
    const silent  = ciclos.filter(c => c[prefix+'status'] === 'FAIL_SILENT').length;
    const desync  = ciclos.filter(c => c[prefix+'status'] === 'FAIL_DESYNC').length;
    const streak  = ciclos[ciclos.length-1]?.[prefix+'streak'] ?? 0;
    const tasa    = total > 0 ? Math.round(ok/total*100) : 0;
    return metricBlock([
      ['Ciclos con datos',          ok,     ok > 0 ? 'ok' : 'danger'],
      ['↳ con desfase SCID (drift)',drift,   drift > 0 ? 'warn' : ''],
      ['Ciclos sin muestra',        empty,   empty > 0 ? 'warn' : ''],
      ['Ciclos MUDO (sin radio)',   silent,  silent > 0 ? 'danger' : ''],
      ['Ciclos DESINCRONIZADO',     desync,  desync > 0 ? 'warn' : ''],
      ['Tasa de éxito',             tasa+'%',tasa > 80 ? 'ok' : 'warn'],
      ['Streak actual',             streak,  streak > 0 ? 'warn' : ''],
    ]);
  }

  document.getElementById('diagTX1').innerHTML = diagBlock('tx1_');
  document.getElementById('diagTX2').innerHTML = diagBlock('tx2_');

  // ── Gráfica de intentos ──
  const ultimos30 = ciclos.slice(-30);
  const labels = ultimos30.map(c => fmtDate(c.created_at));
  upsertChart('chartIntentos', labels, [
    makeDataset('TX1', ultimos30.map(c => v(c.tx1_attempts)), '#4fffb0'),
    makeDataset('TX2', ultimos30.map(c => v(c.tx2_attempts)), '#00d4ff'),
  ]);
  if (charts['chartIntentos']) {
    charts['chartIntentos'].options.scales.y.min = 0;
    charts['chartIntentos'].options.scales.y.max = 3;
    charts['chartIntentos'].update('none');
  }

  // ── Contadores de eventos ──
  const boots    = eventos.filter(e => e.tipo === 'BOOT').length;
  const resyncs  = eventos.filter(e => e.tipo === 'AUTO_RESYNC_TRIGGER').length;
  const nodeFail = eventos.filter(e => e.tipo === 'NODE_FAIL').length;
  document.getElementById('cntBoot').textContent    = boots;
  document.getElementById('cntResync').textContent  = resyncs;
  document.getElementById('cntNodeFail').textContent = nodeFail;
}

function metricBlock(rows) {
  return rows.map(([k, val, cls]) =>
    `<div class="metric-row">
      <span class="metric-key">${k}</span>
      <span class="metric-val ${cls || ''}">${val}</span>
    </div>`
  ).join('');
}

// ═══════════════════════════════════════════════════════
// TAB 3 — SENSORES (por estación)
// ═══════════════════════════════════════════════════════
let estacionActiva = 'rx';

function selectEstacion(est) {
  estacionActiva = est;
  // Botones
  ['rx','tx1','tx2'].forEach(e => {
    document.getElementById('btnEst-' + e).classList.toggle('active', e === est);
  });
  // Bloques
  ['rx','tx1','tx2'].forEach(e => {
    document.getElementById('bloque-' + e).style.display = e === est ? 'block' : 'none';
  });
  // Renderizar solo la estación activa para no crear charts innecesarios
  if (ciclos.length) renderEstacionCharts(est);
}

function renderSensores() {
  if (!ciclos.length) return;
  renderEstacionCharts(estacionActiva);
}

function renderEstacionCharts(est) {
  const data   = ciclos;
  const labels = data.map(c => fmtDate(c.created_at));

  // Color por estación
  const COLOR = est === 'rx' ? '#4fffb0' : est === 'tx1' ? '#00d4ff' : '#ffb347';

  // Prefijo de columna en Supabase
  const prefix = est === 'rx' ? 'rx_' : est === 'tx1' ? 'tx1_' : 'tx2_';
  const ID     = est.toUpperCase();

  function mkChart(suffix, label) {
    const id  = 'chart' + ID + '_' + suffix;
    const key = prefix + suffix;
    upsertChart(id, labels, [
      makeDataset(label, data.map(c => v(c[key])), COLOR)
    ]);
  }

  mkChart('co',      'CO');
  mkChart('no2',     'NO₂');
  mkChart('o3',      'O₃');
  mkChart('so2',     'SO₂');
  mkChart('pm25',    'PM2.5');
  mkChart('pm10',    'PM10');
  mkChart('temp_in', 'Temp. int.');
  mkChart('hum_in',  'Hum. int.');
  mkChart('temp_ex', 'Temp. ext.');
  mkChart('hum_ex',  'Hum. ext.');
  mkChart('flujo1',  'Flujo viento 1');
  mkChart('flujo2',  'Flujo viento 2');
}

// ═══════════════════════════════════════════════════════
// TAB 4 — EVENTOS
// ═══════════════════════════════════════════════════════
function renderEventos(filter) {
  if (filter) activeFilter = filter;
  const data = activeFilter === 'TODOS'
    ? allEventos
    : allEventos.filter(e => e.tipo && e.tipo.includes(activeFilter));

  if (!data.length) {
    document.getElementById('eventosContainer').innerHTML =
      '<div class="empty-state">No hay eventos para este filtro.</div>';
    return;
  }

  let html = '<table class="events-table"><thead><tr>' +
    '<th>Fecha / Hora</th><th>Tipo</th><th>Detalle</th>' +
    '</tr></thead><tbody>';

  data.forEach(ev => {
    const tipoClass = 'tipo-' + (ev.tipo || 'default');
    html += `<tr>
      <td class="event-time">${fmtDatetime(ev.created_at)}</td>
      <td><span class="event-tipo ${tipoClass}">${ev.tipo ?? '—'}</span></td>
      <td class="event-detalle">${ev.detalle ?? ''}</td>
    </tr>`;
  });

  html += '</tbody></table>';
  document.getElementById('eventosContainer').innerHTML = '<div class="table-scroll">' + html + '</div>';
}

function filterEvents(tipo, el) {
  document.querySelectorAll('.events-filter .filter-btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  renderEventos(tipo);
}

// ═══════════════════════════════════════════════════════
// TAB 5 — DESCARGA CSV
// ═══════════════════════════════════════════════════════
async function descargarCSV() {
  const inicio = document.getElementById('fechaInicio').value;
  const fin    = document.getElementById('fechaFin').value;
  const btn    = document.getElementById('btnDescarga');
  const stats  = document.getElementById('downloadStats');

  if (!inicio || !fin) {
    alert('Selecciona ambas fechas antes de exportar.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Descargando…';
  stats.style.display = 'none';

  try {
    const url = `ciclos?select=*&order=created_at.asc&created_at=gte.${inicio}T00:00:00&created_at=lte.${fin}T23:59:59`;
    const data = await sbFetch(url);

    if (!data.length) {
      stats.style.display = 'block';
      stats.textContent = 'No se encontraron registros en ese rango de fechas.';
      return;
    }

    // Construir CSV
    const keys = Object.keys(data[0]);
    const csvRows = [
      keys.join(','),
      ...data.map(row =>
        keys.map(k => {
          const val = row[k];
          if (val === null || val === undefined) return '';
          const s = String(val);
          return s.includes(',') || s.includes('"') ? `"${s.replace(/"/g,'""')}"` : s;
        }).join(',')
      )
    ];
    const csvContent = csvRows.join('\n');

    // Descargar
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `lora_ciclos_${inicio}_${fin}.csv`;
    link.click();
    URL.revokeObjectURL(link.href);

    stats.style.display = 'block';
    stats.textContent = `✓ ${data.length} registros exportados (${inicio} → ${fin})`;

  } catch(err) {
    stats.style.display = 'block';
    stats.textContent = 'Error al descargar: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> Exportar CSV`;
  }
}

// ═══════════════════════════════════════════════════════
// v5 — CONEXIÓN EN VIVO (REALTIME) + RESPALDO POR POLLING
// ═══════════════════════════════════════════════════════
function setConn(mode) {
  connMode = mode;
  const el = document.getElementById('connStatus');
  const txt = document.getElementById('connText');
  el.className = 'conn ' + mode;
  txt.textContent = mode === 'live' ? 'En vivo'
                  : mode === 'polling' ? 'Actualización 30s'
                  : 'Sin conexión';
}
function startPolling() { if (!pollTimer) pollTimer = setInterval(loadAll, 30000); }
function stopPolling()  { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

function onRealtime() { clearTimeout(rtDebounce); rtDebounce = setTimeout(loadAll, 400); }

function initRealtime() {
  sbClient.channel('rt-monitor')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'ciclos' },  onRealtime)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'eventos' }, onRealtime)
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') { setConn('live'); stopPolling(); }
      else if (['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(status)) {
        if (connMode !== 'down') setConn('polling');
        startPolling();
      }
    });
  // Si en 6 s no se suscribió (Realtime no habilitado aún), usar polling
  setTimeout(() => { if (connMode !== 'live') { setConn('polling'); startPolling(); } }, 6000);
}

function updateLastSeen() {
  document.getElementById('lastSeen').textContent = lastCycleTime ? timeAgo(lastCycleTime) : '—';
}

// ═══════════════════════════════════════════════════════
// v5 — AVISOS (TOASTS) + CONTADOR EN EL TÍTULO
// ═══════════════════════════════════════════════════════
function addToast(level, title, msg) {
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast ' + level;
  const hora = new Date().toLocaleTimeString('es-PA', { hour12: false });
  t.innerHTML = `<div class="toast-title">${title}<span class="toast-time">${hora}</span></div>
                 <div class="toast-msg">${msg}</div>`;
  t.onclick = () => t.remove();
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 14000);
  unseenAlerts++;
  document.title = '(' + unseenAlerts + ') ' + BASE_TITLE;
}
window.addEventListener('focus', () => { unseenAlerts = 0; document.title = BASE_TITLE; });

// Detecta condiciones de alerta (mismas que dispararán Telegram en el backend)
function checkAlerts() {
  if (!ciclos.length) return;
  const last = ciclos[ciclos.length - 1];

  // 1) Un nodo falló más de 2 veces seguidas (racha >= ALERTA_STREAK)
  [['TX1','tx1_streak'], ['TX2','tx2_streak']].forEach(([node, key]) => {
    const streak = last[key] ?? 0;
    const flag = 'streak' + node;
    if (streak >= ALERTA_STREAK) {
      if (!alertState[flag]) {
        alertState[flag] = true;
        addToast('danger', '⚠ ' + node + ' con fallos repetidos',
          node + ' lleva ' + streak + ' ciclos seguidos sin entregar datos.');
      }
    } else { alertState[flag] = false; }
  });

  // 2) Ambos nodos TX1 y TX2 en falla simultánea
  const bothFail = FAIL_STATES.includes(last.tx1_status) && FAIL_STATES.includes(last.tx2_status);
  if (bothFail) {
    if (!alertState.bothFail) {
      alertState.bothFail = true;
      addToast('danger', '⛔ Ambos nodos en falla',
        'TX1 y TX2 sin comunicación en el último ciclo. Revisa la red LoRa o la alimentación.');
    }
  } else { alertState.bothFail = false; }
}

// ═══════════════════════════════════════════════════════
// v5 — MÉTRICAS DE CONFIABILIDAD + ÍNDICE DE SALUD
// ═══════════════════════════════════════════════════════
const OK_SET = ['OK','OK_LATE','OK_SCID_DRIFT'];
function clampPct(x) { return Math.max(0, Math.min(100, Math.round(x))); }

function renderReliability() {
  if (!ciclos.length) return;
  const total = ciclos.length;

  const okTX1 = ciclos.filter(c => OK_SET.includes(c.tx1_status)).length;
  const okTX2 = ciclos.filter(c => OK_SET.includes(c.tx2_status)).length;
  const upTX1 = Math.round(okTX1 / total * 100);
  const upTX2 = Math.round(okTX2 / total * 100);
  setUptime('TX1', upTX1, okTX1, total);
  setUptime('TX2', upTX2, okTX2, total);

  const lossGlobal = clampPct((1 - (okTX1 + okTX2) / (2 * total)) * 100);
  document.getElementById('lossGlobal').innerHTML = lossGlobal + '<span>%</span>';

  // MTBF aproximado: observaciones (ciclos × 2 nodos) entre episodios de falla
  let episodes = 0;
  ['tx1_','tx2_'].forEach(p => {
    let inFail = false;
    ciclos.forEach(c => {
      const f = FAIL_STATES.includes(c[p + 'status']);
      if (f && !inFail) episodes++;
      inFail = f;
    });
  });
  document.getElementById('mtbf').innerHTML = episodes > 0
    ? Math.round((total * 2) / episodes) + '<span>ciclos</span>'
    : '∞';

  // ── Índice de salud ──
  const avgUptime = (upTX1 + upTX2) / 2;
  const att = [];
  ciclos.forEach(c => { if (c.tx1_attempts != null) att.push(c.tx1_attempts); if (c.tx2_attempts != null) att.push(c.tx2_attempts); });
  const avgAtt = att.length ? att.reduce((a,b) => a+b, 0) / att.length : 1;
  const effort = 100 - clampPct((avgAtt - 1) / 2 * 100);   // 1 intento = 100, 3 = 0

  const recent = ciclos.slice(-30);
  const linkPcts = [];
  recent.forEach(c => ['tx1','tx2'].forEach(n => {
    const r = c[n + '_rssi'], s = c[n + '_snr'];
    if (r != null) linkPcts.push(clampPct((r - RSSI_RANGE.min) / (RSSI_RANGE.max - RSSI_RANGE.min) * 100));
    if (s != null) linkPcts.push(clampPct((s - SNR_RANGE.min) / (SNR_RANGE.max - SNR_RANGE.min) * 100));
  }));
  const linkScore = linkPcts.length ? linkPcts.reduce((a,b) => a+b, 0) / linkPcts.length : null;

  let health = linkScore != null
    ? 0.5 * avgUptime + 0.2 * effort + 0.3 * linkScore
    : 0.7 * avgUptime + 0.3 * effort;
  renderHealth(clampPct(health));
}

function setUptime(node, pct, ok, total) {
  const color = pct >= 80 ? HEX.ok : pct >= 50 ? HEX.warn : HEX.danger;
  const el = document.getElementById('up' + node);
  el.innerHTML = pct + '<span>%</span>'; el.style.color = color;
  const badge = document.getElementById('upBadge' + node);
  badge.textContent = pct >= 80 ? 'OK' : pct >= 50 ? 'BAJO' : 'CRÍTICO';
  badge.className = 'status-badge ' + (pct >= 80 ? 'badge-ok' : pct >= 50 ? 'badge-warn' : 'badge-danger');
  document.getElementById('upMeta' + node).textContent = ok + ' / ' + total + ' ciclos OK';
}

function renderHealth(h) {
  let color, label;
  if (h >= 85)      { color = HEX.ok;     label = 'EXCELENTE'; }
  else if (h >= 65) { color = '#00d4ff';  label = 'BUENA'; }
  else if (h >= 40) { color = HEX.warn;   label = 'DEGRADADA'; }
  else              { color = HEX.danger; label = 'CRÍTICA'; }
  const num = document.getElementById('healthNum'); num.textContent = h; num.style.color = color;
  const st = document.getElementById('healthState'); st.textContent = '· ' + label; st.style.color = color;
  upsertGauge('healthRing', h, color, true);
}

// ═══════════════════════════════════════════════════════
// v5 — GAUGES CIRCULARES (RSSI / SNR)
// ═══════════════════════════════════════════════════════
function upsertGauge(id, pct, color, full) {
  const c = document.getElementById(id); if (!c) return;
  const data = [pct, 100 - pct];
  if (charts[id]) {
    charts[id].data.datasets[0].data = data;
    charts[id].data.datasets[0].backgroundColor = [color, '#252a38'];
    charts[id].update('none');
    return;
  }
  charts[id] = new Chart(c, {
    type: 'doughnut',
    data: { datasets: [{ data, backgroundColor: [color, '#252a38'], borderWidth: 0 }] },
    options: {
      cutout: '72%',
      rotation: full ? -90 : -135,
      circumference: full ? 360 : 270,
      responsive: true, maintainAspectRatio: true,
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      animation: { duration: 350 }
    }
  });
}

function rssiQuality(v) {
  if (v >= RSSI_THRESH.excelente) return { color: HEX.ok,    label: 'Excelente' };
  if (v >= RSSI_THRESH.buena)     return { color: '#00d4ff', label: 'Buena' };
  if (v >= RSSI_THRESH.debil)     return { color: HEX.warn,  label: 'Débil' };
  return { color: HEX.danger, label: 'Crítica' };
}
function snrQuality(v) {
  if (v >= SNR_THRESH.excelente) return { color: HEX.ok,    label: 'Excelente' };
  if (v >= SNR_THRESH.buena)     return { color: '#00d4ff', label: 'Buena' };
  if (v >= SNR_THRESH.marginal)  return { color: HEX.warn,  label: 'Marginal' };
  return { color: HEX.danger, label: 'Pobre' };
}

function renderGauges() {
  if (!ciclos.length) return;
  const last = ciclos[ciclos.length - 1];
  drawGauge('RSSI', 'TX1', last.tx1_rssi);
  drawGauge('SNR',  'TX1', last.tx1_snr);
  drawGauge('RSSI', 'TX2', last.tx2_rssi);
  drawGauge('SNR',  'TX2', last.tx2_snr);
}
function drawGauge(metric, node, val) {
  const numEl = document.getElementById('num' + metric + '_' + node);
  const qEl   = document.getElementById('q'   + metric + '_' + node);
  const gid   = 'gauge' + metric + '_' + node;
  if (val === null || val === undefined) {
    numEl.textContent = '—'; numEl.style.color = ''; qEl.textContent = '';
    upsertGauge(gid, 0, '#252a38');
    return;
  }
  const range = metric === 'RSSI' ? RSSI_RANGE : SNR_RANGE;
  const pct = clampPct((val - range.min) / (range.max - range.min) * 100);
  const q = metric === 'RSSI' ? rssiQuality(val) : snrQuality(val);
  numEl.textContent = val; numEl.style.color = q.color;
  qEl.textContent = q.label; qEl.style.color = q.color;
  upsertGauge(gid, pct, q.color);
}

// ═══════════════════════════════════════════════════════
// v5 — MAPA DE NODOS (Leaflet + CARTO dark)
// ═══════════════════════════════════════════════════════
function nodeKind(name) {
  if (!ciclos.length) return 'gray';
  const last = ciclos[ciclos.length - 1];
  if (name === 'RX') {
    const mins = (Date.now() - new Date(last.created_at)) / 60000;
    return mins < 12 ? 'ok' : 'warn';
  }
  const st = name === 'TX1' ? last.tx1_status : last.tx2_status;
  if (OK_SET.includes(st)) return 'ok';
  if (['EMPTY','EMPTY_DRIFT'].includes(st)) return 'warn';
  if (st == null) return 'gray';
  return 'danger';
}
function pinIcon(color) {
  return L.divIcon({
    className: '', iconSize: [18,18], iconAnchor: [9,9],
    html: `<div class="map-pin" style="color:${color};background:${color}"></div>`
  });
}
function initMap() {
  if (map) return;
  map = L.map('mapNodos', { zoomControl: true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    { maxZoom: 20, attribution: '© OpenStreetMap, © CARTO' }).addTo(map);
  const bounds = [];
  Object.keys(NODOS).forEach(name => {
    const n = NODOS[name];
    mapMarkers[name] = L.marker([n.lat, n.lng], { icon: pinIcon(HEX.gray) }).addTo(map);
    bounds.push([n.lat, n.lng]);
  });
  map.fitBounds(bounds, { padding: [60,60], maxZoom: 18 });
  renderMap();
}
function renderMap() {
  if (!map) return;
  const labelMap = { ok: 'En línea', warn: 'Atención', danger: 'Falla', gray: 'Sin datos' };
  const last = ciclos[ciclos.length - 1] || {};
  Object.keys(NODOS).forEach(name => {
    const kind = nodeKind(name);
    const m = mapMarkers[name]; if (!m) return;
    m.setIcon(pinIcon(HEX[kind]));
    let extra;
    if (name === 'RX') {
      extra = `Último ciclo: <b>${last.created_at ? timeAgo(last.created_at) : '—'}</b>`;
    } else {
      const p = name.toLowerCase() + '_';
      extra = `RSSI: <b>${last[p+'rssi'] ?? '—'}</b> dBm · SNR: <b>${last[p+'snr'] ?? '—'}</b> dB<br>` +
              `Estado: <b>${last[p+'status'] ?? '—'}</b>`;
    }
    m.bindPopup(`<b>${NODOS[name].label}</b><br>${extra}<br>` +
      `<span style="color:${HEX[kind]}">● ${labelMap[kind]}</span>`);
  });
}

// Fechas por defecto en descarga

const hace7 = new Date(Date.now() - 7*86400000).toISOString().split('T')[0];
document.getElementById('fechaInicio').value = hace7;

abrirTabInicial();                 // respeta la pestaña guardada en la URL (#...)

setInterval(updateLastSeen, 10000); // mantiene fresco el "hace X" del último dato
</script>
