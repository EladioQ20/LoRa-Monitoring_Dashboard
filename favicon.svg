<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1e2a"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </radialGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fffb0"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="#252a38" stroke-width="1.5"/>

  <!-- signal arcs radiating from the coordinator -->
  <g fill="none" stroke="#4fffb0" stroke-linecap="round">
    <path d="M32 32 m-9 0 a9 9 0 0 1 18 0" opacity="0.55" stroke-width="2"/>
    <path d="M32 32 m-15 0 a15 15 0 0 1 30 0" opacity="0.30" stroke-width="2"/>
    <path d="M32 32 m-21 0 a21 21 0 0 1 42 0" opacity="0.15" stroke-width="2"/>
  </g>

  <!-- links to satellite nodes -->
  <g stroke="url(#link)" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="32" y1="32" x2="16" y2="46"/>
    <line x1="32" y1="32" x2="48" y2="46"/>
  </g>

  <!-- satellite nodes (TX1 / TX2) -->
  <circle cx="16" cy="46" r="4.2" fill="#00d4ff"/>
  <circle cx="48" cy="46" r="4.2" fill="#ffb347"/>

  <!-- coordinator node (RX) -->
  <circle cx="32" cy="32" r="6.5" fill="#0d0f14" stroke="#4fffb0" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="2.6" fill="#4fffb0"/>
</svg>
